# Portal Scanner Configuration — Customized for Vedansh Pachori
# Profile: Senior DevOps / Platform Engineering Consultant, 8+ yrs
# Core: Kubernetes, Istio (Ambient Mesh), Terraform, Helm, Jenkins, GitLab CI/CD
# AI-infra edge: Ollama / RAG / LangChain / autonomous agents (kagent)
#
# PRIORITY: Remote / Overseas (Europe, UK, USA, UAE/Dubai) — no-visa / no-citizenship
# Companies listed below either hire fully remote from India, or have explicit
# "work from anywhere" / EoR (Deel / Remote.com) policies. Indian companies are
# included as a lower-priority fallback tier (not primary target).
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Core DevOps / Platform / SRE --
    - "DevOps"
    - "DevSecOps"
    - "SRE"
    - "Site Reliability"
    - "Platform Engineer"
    - "Platform Engineering"
    - "Infrastructure Engineer"
    - "Cloud Engineer"
    - "Cloud Infrastructure"
    - "Cloud Architect"
    - "Systems Engineer"
    - "Production Engineer"
    - "Release Engineer"
    # -- Kubernetes / containers / service mesh --
    - "Kubernetes"
    - "K8s"
    - "Container Platform"
    - "Service Mesh"
    - "Istio"
    # -- CI/CD / IaC / automation --
    - "CI/CD"
    - "Build Engineer"
    - "Automation Engineer"
    - "Infrastructure Automation"
    - "Terraform"
    - "GitOps"
    # -- Observability --
    - "Observability"
    - "Monitoring"
    # -- AI-infra crossover (matches kagent / Ollama / RAG work) --
    - "MLOps"
    - "LLMOps"
    - "AI Infrastructure"
    - "AI Platform"
    - "ML Platform"
    - "AI Engineer"
    - "LLM Engineer"
    - "Agentic"
  negative:
    - "Junior"
    - "Intern"
    - "Trainee"
    - "Graduate"
    - "Associate"
    - ".NET"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby on Rails"
    - "Frontend"
    - "Front-End"
    - "Front End"
    - "React Developer"
    - "Angular"
    - "Vue"
    - "UI Developer"
    - "UX"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Data Scientist"
    - "ML Researcher"
    - "Research Scientist"
    - "Sales"
    - "Marketing"
    - "Recruiter"
    # Visa / relocation-gated roles — exclude since target is remote-from-India
    - "US Citizen"
    - "Security Clearance"
    - "TS/SCI"
    - "must relocate"
    - "onsite only"
  seniority_boost:
    - "Senior"
    - "Sr."
    - "Sr "
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Architect"
    - "Director"

